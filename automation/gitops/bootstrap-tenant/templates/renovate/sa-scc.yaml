{{- if .Values.sdlc.renovate.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "bootstrap-tenant.renovateNamespace" . }}
  labels:
    app: renovate
    lightwell.guid: {{ .Values.guid | quote }}
    lightwell.username: {{ .Values.username | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.username }}-edit
  namespace: {{ include "bootstrap-tenant.renovateNamespace" . }}
  labels:
    app: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: {{ .Values.username }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: renovatejob-manager
  namespace: {{ include "bootstrap-tenant.renovateNamespace" . }}
  labels:
    app: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: ["renovate-operator.mogenius.com"]
    resources: ["renovatejobs", "renovateprojects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.username }}-renovatejob-manager
  namespace: {{ include "bootstrap-tenant.renovateNamespace" . }}
  labels:
    app: renovate
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: renovatejob-manager
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: {{ .Values.username }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: renovate-runner
  namespace: {{ include "bootstrap-tenant.renovateNamespace" . }}
  labels:
    app: renovate
    lightwell.guid: {{ .Values.guid | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: renovate-runner-nonroot-v2-{{ .Values.guid }}
  labels:
    app: renovate
    lightwell.guid: {{ .Values.guid | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:nonroot-v2
subjects:
- kind: ServiceAccount
  name: renovate-runner
  namespace: {{ include "bootstrap-tenant.renovateNamespace" . }}
{{- end }}
