{{- if .Values.tpa.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpa-oidc-setup
  namespace: {{ include "tpa.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpa-oidc-reader-{{ .Values.guid }}
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tpa-oidc-client-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpa-oidc-reader-{{ .Values.guid }}
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpa-oidc-reader-{{ .Values.guid }}
subjects:
  - kind: ServiceAccount
    name: tpa-oidc-setup
    namespace: {{ include "tpa.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: tpa-oidc-setup
  namespace: {{ include "tpa.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: tpa-oidc-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              KC_HOST="{{ include "tpa.keycloakHost" . }}"
              KC_REALM="{{ .Values.keycloak.realm }}"
              GUID="{{ .Values.guid }}"
              TPA_NS="{{ include "tpa.namespace" . }}"

              echo "Copying OIDC client secret to ${TPA_NS}..."
              CLIENT_SECRET=$(oc get secret tpa-oidc-client-secret -n keycloak -o jsonpath='{.data.client-secret}' | base64 -d)
              oc create secret generic oidc-cli \
                -n "${TPA_NS}" \
                --from-literal=client-secret="${CLIENT_SECRET}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "  Secret oidc-cli created in ${TPA_NS}."

              {{- if .Values.tpa.rhda.enabled }}
              RHDA_NS="{{ include "tpa.rhdaNamespace" . }}"
              echo "Copying OIDC client secret to ${RHDA_NS}..."
              oc create secret generic oidc-cli \
                -n "${RHDA_NS}" \
                --from-literal=client-secret="${CLIENT_SECRET}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "  Secret oidc-cli created in ${RHDA_NS}."
              {{- end }}

              echo "TPA OIDC setup complete."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
