{{- if .Values.tpa.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpa-oidc-setup
  namespace: {{ include "tpa.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpa-oidc-reader-{{ .Values.guid }}
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tpa-oidc-client-secret"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpa-oidc-reader-{{ .Values.guid }}
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpa-oidc-reader-{{ .Values.guid }}
subjects:
  - kind: ServiceAccount
    name: tpa-oidc-setup
    namespace: {{ include "tpa.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpa-oidc-writer
  namespace: {{ include "tpa.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpa-oidc-writer
  namespace: {{ include "tpa.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpa-oidc-writer
subjects:
  - kind: ServiceAccount
    name: tpa-oidc-setup
    namespace: {{ include "tpa.namespace" . }}
---
# EDA bootstrap reads oidc-cli to put tpa-cli client_credentials into activation extras.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eda-tpa-oidc-reader-{{ .Values.guid }}
  namespace: {{ include "tpa.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["oidc-cli"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eda-tpa-oidc-reader-{{ .Values.guid }}
  namespace: {{ include "tpa.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eda-tpa-oidc-reader-{{ .Values.guid }}
subjects:
  - kind: ServiceAccount
    name: lightwell-tenant-jobs
    namespace: {{ include "bootstrap-tenant.jobNamespace" . }}
{{- if .Values.tpa.rhda.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpa-oidc-writer
  namespace: {{ include "tpa.rhdaNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpa-oidc-writer
  namespace: {{ include "tpa.rhdaNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tpa-oidc-writer
subjects:
  - kind: ServiceAccount
    name: tpa-oidc-setup
    namespace: {{ include "tpa.namespace" . }}
{{- end }}
{{- end }}
