apiVersion: v1
kind: ConfigMap
metadata:
  name: lightwell-repositories
  namespace: {{ include "bootstrap-tenant.nexusNamespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
data:
  lightwell-repositories.json: |
    [
      {
        "name": "{{ include "bootstrap-tenant.nexusRepoValidated" . }}",
        "type": "proxy",
        "remote_url": "https://packages.redhat.com/lightwell/java/validated/",
        "description": "Lightwell validated packages (tenant {{ .Values.guid }})",
        "requires_auth": true,
        "version_policy": "RELEASE",
        "layout_policy": "STRICT"
      },
      {
        "name": "{{ include "bootstrap-tenant.nexusRepoRemediated" . }}",
        "type": "proxy",
        "remote_url": "https://packages.redhat.com/lightwell/java/remediated/",
        "description": "Lightwell remediated packages (tenant {{ .Values.guid }})",
        "requires_auth": true,
        "version_policy": "RELEASE",
        "layout_policy": "STRICT"
      }
    ]
