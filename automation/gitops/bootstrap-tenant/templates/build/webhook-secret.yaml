{{- if .Values.build.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-pac-webhook-secret
  namespace: build-{{ .Values.guid }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
stringData:
  webhook-secret: {{ .Values.build.webhookSecret | default (printf "pac-%s-%s" .Values.guid .Values.password | sha256sum | trunc 32) | quote }}
{{- end }}
