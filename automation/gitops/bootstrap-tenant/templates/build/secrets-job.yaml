{{- if .Values.build.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: build-setup-secrets
  namespace: build-{{ .Values.guid }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: build-setup
      restartPolicy: OnFailure
      containers:
        - name: setup
          image: registry.redhat.io/openshift4/ose-cli-rhel9:latest
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              BUILD_NS="build-{{ .Values.guid }}"
              GITLAB_NS="{{ .Values.gitlab.namespace | default "gitlab" }}"
              KEYCLOAK_NS="keycloak"
              NEXUS_NS="{{ include "bootstrap-tenant.nexusNamespace" . }}"
              NEXUS_HOST="nexus-oci-{{ .Values.guid }}.{{ .Values.deployer.domain }}"

              echo "Copying GitLab root PAT to ${BUILD_NS}..."
              GITLAB_TOKEN=$(oc get secret root-user-personal-token -n "${GITLAB_NS}" -o jsonpath='{.data.token}' | base64 -d)
              oc create secret generic gitlab-pac-token \
                -n "${BUILD_NS}" \
                --from-literal=token="${GITLAB_TOKEN}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "  gitlab-pac-token created."

              echo "Copying TPA OIDC client secret to ${BUILD_NS}..."
              TPA_SECRET=$(oc get secret tpa-oidc-client-secret -n "${KEYCLOAK_NS}" -o jsonpath='{.data.client-secret}' | base64 -d)
              oc create secret generic oidc-cli \
                -n "${BUILD_NS}" \
                --from-literal=client-secret="${TPA_SECRET}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "  oidc-cli created."

              echo "Creating Nexus push credentials for ${NEXUS_HOST}..."
              NEXUS_PASS=$(oc get secret nexus-admin-secret -n "${NEXUS_NS}" -o jsonpath='{.data.password}' | base64 -d)
              oc create secret docker-registry nexus-push-credentials \
                -n "${BUILD_NS}" \
                --docker-server="${NEXUS_HOST}" \
                --docker-username=admin \
                --docker-password="${NEXUS_PASS}" \
                --dry-run=client -o yaml | oc apply -f -
              echo "  nexus-push-credentials created."

              echo "Build secrets setup complete."
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
