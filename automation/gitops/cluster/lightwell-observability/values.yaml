enabled: true

namespace: lightwell-observability

operators:
  # Install operators into openshift-operators (shared OperatorGroup already exists there).
  targetNamespace: openshift-operators
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  tempo:
    enabled: true
    name: tempo-product
    channel: stable
  opentelemetry:
    enabled: true
    name: opentelemetry-product
    channel: stable
  clusterObservability:
    enabled: true
    name: cluster-observability-operator
    channel: stable

tempo:
  name: lightwell
  # pv so a Tempo restart does not drop the remediations from a workshop day.
  storageBackend: pv
  storageSize: 2Gi

otel:
  name: lightwell
  # X-Scope-OrgID on the collector, and the tenant the console plugin lists.
  # The Traces page ignores a TempoMonolithic with multitenancy disabled.
  tenant: lightwell

uiPlugins:
  distributedTracing: true
  monitoringPerses: true

perses:
  dashboard:
    enabled: true
    name: lightwell-remediation
    # Namespace must match where PersesDashboard lives (Observe → Dashboards selector).
    namespace: lightwell-observability
