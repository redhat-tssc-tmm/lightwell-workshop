{{- if .Values.enabled }}
apiVersion: tempo.grafana.com/v1alpha1
kind: TempoMonolithic
metadata:
  name: {{ .Values.tempo.name }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # CRDs appear after Subscription installs the Tempo operator.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  storage:
    traces:
      backend: {{ .Values.tempo.storageBackend }}
      size: {{ .Values.tempo.storageSize }}
  # The console plugin lists only Tempo instances with OpenShift multitenancy
  # (OU-467). A single-tenant TempoMonolithic shows up as "no tempo instance".
  multitenancy:
    enabled: true
    mode: openshift
    authentication:
      - tenantName: {{ .Values.otel.tenant }}
        tenantId: {{ .Values.otel.tenant | quote }}
{{- end }}
