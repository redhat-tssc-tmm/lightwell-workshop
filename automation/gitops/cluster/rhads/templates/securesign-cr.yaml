apiVersion: rhtas.redhat.com/v1alpha1
kind: Securesign
metadata:
  name: {{ .Values.rhtas.instance }}
  namespace: {{ .Values.rhtas.namespace }}
  annotations:
    rhtas.redhat.com/metrics: 'true'
    argocd.argoproj.io/sync-wave: {{ .Values.rhtas.syncwave.securesign | quote }}
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  fulcio:
    certificate:
      commonName: {{ .Values.rhtas.rootCert.commonName }}
      organizationEmail: {{ .Values.rhtas.rootCert.email }}
      organizationName: {{ .Values.rhtas.rootCert.org }}
    config:
      OIDCIssuers:
        - ClientID: {{ .Values.rhtas.oidc.clientId }}
          Issuer: 'https://sso.{{ .Values.deployer.domain }}/realms/{{ .Values.rhtas.keycloak.realm }}'
          IssuerURL: 'https://sso.{{ .Values.deployer.domain }}/realms/{{ .Values.rhtas.keycloak.realm }}'
          Type: email
        - ClientID: {{ .Values.rhtas.oidc.clientId }}
          Issuer: https://kubernetes.default.svc
          IssuerURL: https://kubernetes.default.svc
          Type: kubernetes
    ctlog:
      port: 80
      prefix: trusted-artifact-signer
    externalAccess:
      enabled: true
    monitoring:
      enabled: true
  rekor:
    monitoring:
      enabled: true
    signer:
      kms: secret
    trillian:
      port: 8091
    externalAccess:
      enabled: true
    backFillRedis:
      enabled: true
      schedule: 0 0 * * *
    rekorSearchUI:
      enabled: true
    pvc:
      accessModes:
        - ReadWriteOnce
      retain: true
      size: 5Gi
  trillian:
    database:
      create: true
      pvc:
        accessModes:
          - ReadWriteOnce
        retain: true
        size: 5Gi
    monitoring:
      enabled: true
  tsa:
    externalAccess:
      enabled: true
    monitoring:
      enabled: true
    ntpMonitoring:
      enabled: true
    signer:
      certificateChain:
        rootCA:
          commonName: {{ .Values.rhtas.rootCert.commonName }}-tsa-root
          organizationEmail: {{ .Values.rhtas.rootCert.email }}
          organizationName: {{ .Values.rhtas.rootCert.org }}
        intermediateCA:
          - commonName: {{ .Values.rhtas.rootCert.commonName }}-tsa-intermediate
            organizationEmail: {{ .Values.rhtas.rootCert.email }}
            organizationName: {{ .Values.rhtas.rootCert.org }}
        leafCA:
          commonName: {{ .Values.rhtas.rootCert.commonName }}-tsa-leafCA
          organizationEmail: {{ .Values.rhtas.rootCert.email }}
          organizationName: {{ .Values.rhtas.rootCert.org }}
  tuf:
    externalAccess:
      enabled: true
    keys:
      - name: rekor.pub
      - name: ctfe.pub
      - name: fulcio_v1.crt.pem
      - name: tsa.certchain.pem
    port: 80
    pvc:
      accessModes:
        - ReadWriteOnce
      retain: true
      size: 100Mi
    rootKeySecretRef:
      name: tuf-root-keys
