apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate-operator
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: renovate-operator
    repoURL: ghcr.io/mogenius/helm-charts
    targetRevision: 6.4.0
    helm:
      releaseName: renovate-operator
      valuesObject:
        rbac:
          ownNamespaceOnly: false
        securityContext:
          pod: {}
          container: {}
        auth:
          oidc:
            enabled: true
            issuerUrl: https://sso.{{ .Values.deployer.domain }}/realms/sso
            clientId: renovate-ui
            existingSecret: renovate-oidc-secret
            secretKey: client-secret
            insecureSkipVerify: true
            redirectUrl: https://renovate-operator-renovate-operator.{{ .Values.deployer.domain }}/auth/callback
        crd:
          install: true
          mode: template
          securityContext:
            pod: {}
            container: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
