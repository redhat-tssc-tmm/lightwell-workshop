{{- if .Values.agentSandbox.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
{{ include "app-of-apps.metadata" (dict "name" "agent-sandbox" "namespace" .Values.argocd.namespace "syncWave" "2") }}
spec:
  destination:
    namespace: {{ .Values.agentSandbox.namespace }}
    server: https://kubernetes.default.svc
  project: default
  source:
    path: automation/gitops/cluster/agent-sandbox
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    helm:
      valuesObject:
        enabled: {{ .Values.agentSandbox.enabled }}
        name: {{ .Values.agentSandbox.name }}
        channel: {{ .Values.agentSandbox.channel }}
        startingCSV: {{ .Values.agentSandbox.startingCSV }}
        source: {{ .Values.agentSandbox.source }}
        sourceNamespace: {{ .Values.agentSandbox.sourceNamespace }}
        namespace: {{ .Values.agentSandbox.namespace }}
        metrics:
          serviceMonitor:
            enabled: {{ .Values.agentSandbox.metrics.serviceMonitor.enabled }}
            interval: {{ .Values.agentSandbox.metrics.serviceMonitor.interval }}
            scrapeTimeout: {{ .Values.agentSandbox.metrics.serviceMonitor.scrapeTimeout }}
            {{- with .Values.agentSandbox.metrics.serviceMonitor.labels }}
            labels:
              {{- toYaml . | nindent 14 }}
            {{- end }}
{{ include "app-of-apps.syncPolicy" . | indent 2 }}
{{- end }}
